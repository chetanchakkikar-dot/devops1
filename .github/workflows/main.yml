name: Flask Student Result CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pytest

      - name: Run Flask application tests
        run: |
          python -m pytest



def test_home():
    client = app.test_client()
    response = client.get("/")

    assert response.status_code == 200
    assert response.json["application"] == (
        "Student Result Management System"
    )


def test_health():
    client = app.test_client()
    response = client.get("/health")

    assert response.status_code == 200
    assert response.json["status"] == "healthy"


def test_student_result():
    client = app.test_client()
    response = client.get("/results/101")

    assert response.status_code == 200
    data = response.json

    assert data["name"] == "Aarav Shah"
    assert data["total"] == 251
    assert data["percentage"] == 83.67
    assert data["status"] == "PASS"


def test_failed_student():
    client = app.test_client()
    response = client.get("/results/103")

    assert response.status_code == 200
    assert response.json["status"] == "FAIL"



    client = app.test_client()
    response = client.get("/results/999")

    assert response.status_code == 404
    assert response.json["error"] == (
        "Student roll number not found"
    )









